upstream api {
    server api:8000;
}

# Brute-force protection for login/register: 10 requests/minute per client IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json text/css application/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Inherited by every location below that proxies to the API.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
    }

    location /api/ {
        proxy_pass http://api;
    }

    # Web UI (static build). Unknown paths fall back to index.html for client-side routing.
    root /usr/share/nginx/html;

    # `expires` rather than add_header, which would drop the security headers above.
    location /assets/ {
        expires 1y;  # file names are content-hashed
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;  # always revalidate index.html so new deploys are picked up
    }
}
